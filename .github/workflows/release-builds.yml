name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Match tag to crate version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be semantic versioning with a v prefix, for example v0.1.0."
            exit 1
          fi
          crate_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [[ "$RELEASE_TAG" != "v$crate_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $crate_version."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release source
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all

  build:
    name: Build ${{ matrix.label }}
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            binary: hydian.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-aarch64
            binary: hydian.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            binary: hydian
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-aarch64
            binary: hydian
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            binary: hydian
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
            binary: hydian
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build optimized binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test binary
        if: runner.os != 'Windows'
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      - name: Smoke test binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "target/${{ matrix.target }}/release/${{ matrix.binary }}" --version'

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "hydian-$env:RELEASE_TAG"
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $packageDir, $distDir | Out-Null
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/${{ matrix.binary }}" -Destination $packageDir
          Copy-Item -LiteralPath "README.md", "LICENSE-MIT", "LICENSE-APACHE" -Destination $packageDir
          $archive = Join-Path $distDir "hydian-$env:RELEASE_TAG-${{ matrix.label }}.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $archive

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/hydian-$RELEASE_TAG"
          dist_dir="$GITHUB_WORKSPACE/dist"
          mkdir -p "$package_dir" "$dist_dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$package_dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$package_dir/"
          tar -czf "$dist_dir/hydian-$RELEASE_TAG-${{ matrix.label }}.tar.gz" -C "$package_dir" .

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum hydian-* > SHA256SUMS

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          assets=(dist/*)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Hydian $RELEASE_TAG" \
              --latest
          fi
