[package]
name = "hydian"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, dependable Model Context Protocol multiplexer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rainmana/Hydian"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "gateway", "multiplexer"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
clap_complete = "4.6.7"
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.31"
http = "1.4.0"
is-terminal = "0.4.17"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "native-tls"] }
rmcp = { version = "=2.2.0", features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
schemars = { version = "1.2.1", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tempfile = "3.24.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.1.3"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
which = "8.0.0"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
